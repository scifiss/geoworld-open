[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoworld-open"
version = "0.1.0"
description = "Typed, deterministic synthetic geoscience workflows for education and research."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "scifiss"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0",
  "typer>=0.9",
]

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
geoworld-open = "geoworld_open.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
