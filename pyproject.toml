[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoworld-open"
version = "0.1.0"
description = "Executable standards, SDK, reference science, and benchmarks for semantic geoscience Worlds."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "scifiss"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0",
  "typer>=0.9",
  "xarray>=2024.1",
]

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/scifiss/geoworld-open"
Documentation = "https://github.com/scifiss/geoworld-open#readme"
"Live Demo" = "https://geoworld-studio.onrender.com/"
"Engineering Blog" = "https://geoworld.hashnode.dev/"

[project.scripts]
geoworld-open = "geoworld_open.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"geoworld_open.benchmarks.data" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
