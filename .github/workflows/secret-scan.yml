name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Scan tracked files
        run: python scripts/scan_secrets.py

  gitleaks-history:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.27.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks release
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "${base}/${archive}" --output "/tmp/${archive}"
          curl --fail --location --silent --show-error "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output /tmp/gitleaks-checksums.txt
          grep " ${archive}$" /tmp/gitleaks-checksums.txt | (cd /tmp && sha256sum --check -)
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan complete Git history with Gitleaks
        run: gitleaks git --redact --no-banner --verbose .
