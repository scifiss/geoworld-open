name: Secret Scan

on:
  push:
  pull_request:

jobs:
  current-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Scan tracked files
        run: python scripts/scan_secrets.py

