flagship_schema_version: "1.0"

structural:
  schema_version: "2.0"
  metadata:
    name: flagship_faulted_reservoir
    description: Bounded synthetic reservoir-region, well, state-change, and observation demonstration.
  seed: 20260812
  grid:
    nx: 160
    ndepth: 120
    dx_m: 10.0
    ddepth_m: 5.0
    x_origin_m: 0.0
    depth_origin_m: 0.0
  facies:
    - id: shale
      code: 1
      label: Shale
    - id: sand
      code: 2
      label: Sand
  layers:
    - id: upper_shale
      name: Upper shale
      facies_id: shale
      thickness_m: 150.0
      porosity_fraction: 0.08
      is_reservoir: false
    - id: reservoir_sand
      name: Reservoir sand
      facies_id: sand
      thickness_m: 180.0
      porosity_fraction: 0.24
      is_reservoir: true
    - id: lower_shale
      name: Lower shale
      facies_id: shale
      thickness_m: 270.0
      porosity_fraction: 0.09
      is_reservoir: false
  structures:
    - kind: fold
      id: gentle_fold
      amplitude_m: 15.0
      wavelength_m: 1600.0
      phase_deg: 0.0
      x_origin_m: 0.0
    - kind: fault
      id: fault_f1
      x_position_m: 800.0
      reference_depth_m: 250.0
      dip_deg: 60.0
      dip_direction: positive_x
      throw_m: 30.0
      displacement: normal
      displaced_side: positive_x
  structural_method:
    method_id: analytic_source_depth_v1
    operation_order: listed
    boundary_behavior: clip_to_grid
  outputs:
    save_arrays: true
    save_dataset_metadata: true
    save_diagnostic_figure: true
  assumptions:
    - Layers, facies, porosity, fold, and fault are explicit synthetic inputs.
    - Fold and fault geometry use Gate 3 analytic source-depth transforms in listed order.
    - Reservoir role is authored and does not imply productivity, connectivity, reserves, or capacity.

reservoir_region:
  id: r1
  label: Reservoir Region R1
  formation_id: reservoir_sand
  intersecting_fault_id: fault_f1

well:
  id: w1
  label: Well W1
  x_m: 700.0
  top_depth_m: 0.0
  bottom_depth_m: 600.0

baseline:
  pressure_reference_pa: 101325.0
  pressure_reference_depth_m: 0.0
  reference_density_kg_m3: 1025.0
  gravity_m_s2: 9.80665
  temperature_reference_deg_c: 20.0
  temperature_reference_depth_m: 0.0
  geothermal_gradient_deg_c_per_m: 0.03

perturbation:
  maximum_delta_pressure_pa: 2000000.0
  center_x_m: 700.0
  center_depth_m: 240.0
  sigma_x_m: 180.0
  sigma_depth_m: 60.0
  model_time_days: 30.0

observation:
  sample_depths_m: [190.0, 240.0, 290.0]
  sampling_method: nearest_cell
  noise_sigma_pa: 25000.0
  noise_seed: 20260812
  noise_namespace: flagship_well_pressure_observation

outputs:
  save_diagnostic_figure: true

assumptions:
  - Baseline pressure is an illustrative hydrostatic benchmark, not calibrated formation pressure.
  - Temperature is an illustrative linear geothermal-gradient field; no heat transport is modeled.
  - The pressure change is an analytic Gaussian-like benchmark masked by Reservoir Region R1.
  - No flow equation, diffusion equation, mass conservation, permeability, relative permeability, capillary pressure, or fluid transport is modeled.
  - No history matching, production prediction, or calibration is performed.
  - Model time labels the synthetic benchmark state and is not a time-integrated flow solution.
  - Well pressure uses nearest-cell sampling and explicit deterministic Gaussian noise.
